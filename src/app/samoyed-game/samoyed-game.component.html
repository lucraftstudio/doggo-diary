<main class="game-page">
  <section class="game" aria-labelledby="game-title">
    <header class="game-header">
      <div>
        <h1 id="game-title">棉花的小日子</h1>
        <p>一个小房间，和一只喜欢你的萨摩耶。</p>
      </div>
      <span class="room-label">棉花的家</span>
    </header>
    <div class="room-frame">
      <canvas #roomCanvas width="384" height="240" role="img"
        aria-label="像素风小房间，里面住着一只白色萨摩耶，有窗户、饭碗、地毯和狗窝"></canvas>
      <div class="room-caption">
        <span class="status-dot" [class.asleep]="sleeping"></span>
        <span>{{ actionLabel }}</span>
      </div>
    </div>
    <section class="care-panel" aria-label="照顾棉花">
      <div class="dog-profile">
        <div>
          <h2>{{ dogName }}</h2>
          <p>萨摩耶 · 你的毛茸茸室友</p>
        </div>
        <span class="profile-note">一起慢慢长大</span>
      </div>
      <div class="needs" aria-label="狗狗状态">
        <div class="need">
          <div class="need-label">
            <label for="fullness">饱食</label><span>{{ fullness }}<small>/100</small></span>
          </div>
          <progress id="fullness" max="100" [value]="fullness"></progress>
        </div>
        <div class="need">
          <div class="need-label">
            <label for="happiness">心情</label><span>{{ happiness }}<small>/100</small></span>
          </div>
          <progress id="happiness" class="happiness" max="100" [value]="happiness"></progress>
        </div>
        <div class="need">
          <div class="need-label">
            <label for="energy">体力</label><span>{{ energy }}<small>/100</small></span>
          </div>
          <progress id="energy" class="energy" max="100" [value]="energy"></progress>
        </div>
      </div>
      <p class="message" role="status" aria-live="polite">{{ message }}</p>
      <div class="actions">
        <button type="button" class="action-button feed" [disabled]="busy || sleeping" (click)="feed()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16l-2 9H6l-2-9Zm3 0V7h10v3M3 19h18" /></svg>
          <span>喂食</span>
        </button>
        <button type="button" class="action-button play" [disabled]="busy || sleeping" (click)="play()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M5 8c5 0 11 6 11 11M8 5c0 5 6 11 11 11" /></svg>
          <span>陪玩</span>
        </button>
        <button type="button" class="action-button sleep" [disabled]="busy" [attr.aria-pressed]="sleeping" (click)="toggleSleep()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 15A8 8 0 0 1 9 5a8 8 0 1 0 10 10Z" /></svg>
          <span>{{ sleepButtonLabel }}</span>
        </button>
      </div>
    </section>
    <footer class="game-footer">不用赶时间，陪伴就是今天的小任务。</footer>
  </section>
</main>
